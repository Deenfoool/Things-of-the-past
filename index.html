<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#151714" />
  <meta name="description" content="Дела прошлого — постсоветская детективная point-and-click игра." />
  <title>Дела прошлого</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="game" id="game" aria-label="Кабинет следователя">
    <div class="scene" id="scene">
      <img class="scene__image is-current" id="sceneImage" src="./table.png" alt="Кабинет следователя" draggable="false" />
      <img class="scene__image scene__image--next" id="nextImage" src="./monitor.png" alt="" draggable="false" />
      <div class="scene__shade" aria-hidden="true"></div>
      <div class="scene__grain" aria-hidden="true"></div>
      <div class="hotspots" id="hotspots" aria-label="Интерактивные объекты"></div>
    </div>

    <header class="hud">
      <div class="hud__case">
        <span class="hud__eyebrow" id="roomLabel">Кабинет следователя</span>
        <strong class="hud__title">ДЕЛА ПРОШЛОГО</strong>
      </div>
      <button class="hud__button" id="helpButton" type="button" aria-label="Управление">?</button>
    </header>

    <button class="turn turn--left" id="turnLeft" type="button" aria-label="Повернуться налево">
      <span aria-hidden="true">‹</span>
    </button>
    <button class="turn turn--right" id="turnRight" type="button" aria-label="Повернуться направо">
      <span aria-hidden="true">›</span>
    </button>

    <div class="scene-label" id="sceneLabel" aria-live="polite">Рабочий стол</div>
    <div class="observation" id="observation" role="status" aria-live="polite"></div>

    <nav class="inventory" aria-label="Инвентарь">
      <button class="inventory__slot" type="button" data-panel="case">
        <span class="inventory__icon">▤</span>
        <span>Дело</span>
      </button>
      <div class="inventory__empty" aria-label="Пустой слот"></div>
      <div class="inventory__empty" aria-label="Пустой слот"></div>
      <div class="inventory__empty" aria-label="Пустой слот"></div>
      <button class="inventory__slot" type="button" data-panel="notes">
        <span class="inventory__icon">✎</span>
        <span>Записи</span>
      </button>
    </nav>

    <div class="modal" id="modal" aria-hidden="true">
      <button class="modal__backdrop" id="modalBackdrop" type="button" aria-label="Закрыть окно"></button>
      <section class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal__close" id="modalClose" type="button" aria-label="Закрыть">×</button>
        <span class="modal__eyebrow" id="modalEyebrow">Осмотр</span>
        <h2 id="modalTitle">Объект</h2>
        <p id="modalText"></p>
      </section>
    </div>

    <div class="help" id="help" aria-hidden="true">
      <div class="help__panel">
        <strong>Управление</strong>
        <span>← → / A D — повернуться</span>
        <span>Клик — взаимодействовать</span>
        <span>F2 — показать точки интереса</span>
        <span>Esc — закрыть окно</span>
      </div>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
